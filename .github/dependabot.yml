version: 2
updates:
  # Maintain dependencies for npm packages across monorepo (grouped & non-breaking)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - '*'
    # Ignore breaking major version upgrades for critical tooling
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci(actions)'
