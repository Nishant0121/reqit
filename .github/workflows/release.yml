name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package-cmd: pnpm --filter @reqit/desktop run package:win
          - os: macos-latest
            package-cmd: pnpm --filter @reqit/desktop run package:mac
          - os: ubuntu-latest
            package-cmd: pnpm --filter @reqit/desktop run package:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build packages
        run: pnpm --filter @reqit/desktop run build

      - name: Package application
        run: ${{ matrix.package-cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packages/desktop/release/*/*.exe
            packages/desktop/release/*/*.dmg
            packages/desktop/release/*/*.AppImage
            packages/desktop/release/*/*.deb
            packages/desktop/release/*/*.zip
            packages/desktop/release/*/*.tar.gz
            packages/desktop/release/*/*.blockmap
            packages/desktop/release/*/*.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
