version: 1
name: Long Scripts Test
method: POST
url: 'https://api.example.com/process'

scripts:
  pre: |
    // Generate complex telemetry payload before sending request
    const timestamp = Date.now();
    const nonce = Math.random().toString(36).substring(2, 15);
    req.setHeader("X-Timestamp", String(timestamp));
    req.setHeader("X-Nonce", nonce);

    // Compute HMAC or synthetic signature
    let hash = 0;
    const raw = `${timestamp}:${nonce}`;
    for (let i = 0; i < raw.length; i++) {
      const char = raw.charCodeAt(i);
      hash = (hash << 5) - hash + char;
      hash |= 0;
    }
    req.setHeader("X-Signature", String(hash));

    // Audit log
    console.log(`[REQIT-PRE] Prepared request with nonce: ${nonce} at: ${timestamp}`);
  post: |
    // Validate response payload thoroughly
    if (res.status === 200) {
      console.log(`[REQIT-POST] Success response received in ${res.sizeBytes} bytes`);
      const body = res.json();
      if (body && body.data) {
        reqit.setVar("sessionToken", body.data.token);
        reqit.setVar("expiresAt", body.data.expiresAt);
      }
      for (const item of body.items || []) {
        console.log(`Processing item: ${item.id}`);
      }
    } else {
      console.warn(`[REQIT-POST] Unexpected status code ${res.status}: ${res.statusText}`);
    }
