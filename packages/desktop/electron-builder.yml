appId: com.reqit.desktop
productName: Reqit
executableName: reqit
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
toolsets:
  appimage: '1.0.3'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
linux:
  executableName: reqit
  desktopName: reqit
  target:
    - target: AppImage
    - target: deb
  category: Development
